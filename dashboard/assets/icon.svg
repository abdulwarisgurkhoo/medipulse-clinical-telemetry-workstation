<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55" />
      <stop offset="100%" stop-color="#ff6b8b" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Subtle Medical Cross Backdrop -->
  <path d="M216 120 h80 v272 h-80 z M120 216 h272 v80 h-272 z" fill="rgba(0, 229, 255, 0.04)" />
  
  <!-- Stylized Heart Icon -->
  <path d="M256 420 C256 420 100 320 100 200 C100 140 145 95 205 95 C235 95 250 115 256 125 C262 115 277 95 307 95 C367 95 412 140 412 200 C412 320 256 420 256 420 Z" 
        fill="url(#heartGrad)" opacity="0.18" />

  <!-- Outer Pulsing Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Glowing ECG Pulse Wave -->
  <path d="M70 256 L160 256 L185 220 L210 290 L240 130 L275 370 L305 210 L330 270 L350 256 L442 256" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
        
  <!-- Floating Pulse Bead -->
  <circle cx="240" cy="130" r="10" fill="#00ff88" filter="url(#glow)" />
</svg>
